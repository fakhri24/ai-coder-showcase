<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg_3d-parkour" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f72585"/>
      <stop offset="50%" stop-color="#7209b7"/>
      <stop offset="100%" stop-color="#f72585"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg_3d-parkour)"/>

  <!-- Extra artwork -->
  
            <polygon points="200,340 320,270 440,340 320,390" fill="#7209b7" opacity="0.7"/>
            <polygon points="320,270 440,340 440,310 320,240" fill="#f72585" opacity="0.8"/>
            <polygon points="200,340 320,270 320,240 200,310" fill="#4361ee" opacity="0.8"/>
            <polygon points="260,230 320,195 380,230 320,260" fill="#4cc9f0" opacity="0.9"/>
            <circle cx="320" cy="150" r="18" fill="#f72585" filter="url(#glow)"/>
        

  <!-- Badge Top -->
  <rect x="40" y="36" width="48" height="48" rx="12" fill="rgba(255,255,255,0.1)" stroke="#4361ee" stroke-width="1.5"/>
  <text x="64" y="70" font-size="24" text-anchor="middle">🏃‍♂️</text>

  <!-- Title & Subtitle -->
  <text x="104" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">3D Parkour Adventure</text>
  <text x="104" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#4361ee">WebGL 3D Platformer</text>
</svg>