<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg_neon-defender" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f051d"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f051d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg_neon-defender)"/>

  <!-- Extra artwork -->
  
            <!-- Neon perspective floor grid -->
            <g stroke="#d946ef" stroke-width="1.5" opacity="0.4">
                <line x1="320" y1="200" x2="100" y2="400"/>
                <line x1="320" y1="200" x2="210" y2="400"/>
                <line x1="320" y1="200" x2="320" y2="400"/>
                <line x1="320" y1="200" x2="430" y2="400"/>
                <line x1="320" y1="200" x2="540" y2="400"/>
                <ellipse cx="320" cy="350" rx="220" ry="35" fill="none"/>
            </g>
            <!-- Cyber Cannon / Shield -->
            <polygon points="320,180 345,230 320,220 295,230" fill="#06b6d4" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
        

  <!-- Badge Top -->
  <rect x="40" y="36" width="48" height="48" rx="12" fill="rgba(255,255,255,0.1)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="64" y="70" font-size="24" text-anchor="middle">🛡️</text>

  <!-- Title & Subtitle -->
  <text x="104" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Neon Defender</text>
  <text x="104" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#a855f7">Futuristic 2D Cyber Arcade</text>
</svg>