<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg_macaron-break" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg_macaron-break)"/>

  <!-- Extra artwork -->
  
            <!-- Macaron Bricks -->
            <rect x="160" y="180" width="65" height="24" rx="12" fill="#f472b6"/>
            <rect x="240" y="180" width="65" height="24" rx="12" fill="#67e8f9"/>
            <rect x="320" y="180" width="65" height="24" rx="12" fill="#fde047"/>
            <rect x="400" y="180" width="65" height="24" rx="12" fill="#c084fc"/>
            
            <rect x="200" y="215" width="65" height="24" rx="12" fill="#fbcfe8"/>
            <rect x="280" y="215" width="65" height="24" rx="12" fill="#a7f3d0"/>
            <rect x="360" y="215" width="65" height="24" rx="12" fill="#fed7aa"/>

            <!-- Bouncing Ball & Paddle -->
            <circle cx="320" cy="270" r="9" fill="#ffffff" filter="url(#glow)"/>
            <rect x="270" y="320" width="100" height="16" rx="8" fill="#f43f5e" stroke="#fecdd3" stroke-width="2"/>
        

  <!-- Badge Top -->
  <rect x="40" y="36" width="48" height="48" rx="12" fill="rgba(255,255,255,0.1)" stroke="#f472b6" stroke-width="1.5"/>
  <text x="64" y="70" font-size="24" text-anchor="middle">🧁</text>

  <!-- Title & Subtitle -->
  <text x="104" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Macaron Break</text>
  <text x="104" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#f472b6">Pastel Brick Breaker Arcade</text>
</svg>