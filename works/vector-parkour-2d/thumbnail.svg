<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg_vector-parkour-2d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg_vector-parkour-2d)"/>

  <!-- Extra artwork -->
  
            <!-- Skyline buildings -->
            <rect x="100" y="260" width="80" height="140" fill="#27272a"/>
            <rect x="190" y="220" width="90" height="180" fill="#3f3f46"/>
            <rect x="290" y="250" width="85" height="150" fill="#27272a"/>
            <rect x="385" y="200" width="110" height="200" fill="#52525b"/>
            <rect x="505" y="270" width="75" height="130" fill="#27272a"/>
            <!-- Jumper silhouette neon glow -->
            <circle cx="340" cy="180" r="10" fill="#60a5fa" filter="url(#glow)"/>
            <line x1="340" y1="190" x2="335" y2="215" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
            <line x1="335" y1="200" x2="320" y2="195" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
            <line x1="335" y1="215" x2="320" y2="235" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="335" y1="215" x2="355" y2="230" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round"/>
        

  <!-- Badge Top -->
  <rect x="40" y="36" width="48" height="48" rx="12" fill="rgba(255,255,255,0.1)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="64" y="70" font-size="24" text-anchor="middle">🏃</text>

  <!-- Title & Subtitle -->
  <text x="104" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Vector Parkour 2D</text>
  <text x="104" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#3b82f6">Urban Vector Runner Game</text>
</svg>