<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg_neon-flappy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg_neon-flappy)"/>

  <!-- Extra artwork -->
  
            <!-- Neon pipes -->
            <rect x="190" y="100" width="50" height="100" fill="#042f2e" stroke="#14b8a6" stroke-width="3" filter="url(#glow)"/>
            <rect x="190" y="280" width="50" height="120" fill="#042f2e" stroke="#14b8a6" stroke-width="3" filter="url(#glow)"/>
            
            <rect x="390" y="80" width="50" height="140" fill="#042f2e" stroke="#14b8a6" stroke-width="3" filter="url(#glow)"/>
            <rect x="390" y="300" width="50" height="100" fill="#042f2e" stroke="#14b8a6" stroke-width="3" filter="url(#glow)"/>
            
            <!-- Neon Flappy Bird -->
            <circle cx="300" cy="230" r="16" fill="#facc15" filter="url(#glow)"/>
            <circle cx="306" cy="226" r="4" fill="#000"/>
            <polygon points="316,230 326,234 316,238" fill="#ea580c"/>
        

  <!-- Badge Top -->
  <rect x="40" y="36" width="48" height="48" rx="12" fill="rgba(255,255,255,0.1)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="64" y="70" font-size="24" text-anchor="middle">🐥</text>

  <!-- Title & Subtitle -->
  <text x="104" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">NEON FLAPPY</text>
  <text x="104" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#22d3ee">Glowing Arcade Bird Adventure</text>
</svg>