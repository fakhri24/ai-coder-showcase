<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1524"/>
      <stop offset="50%" stop-color="#16263c"/>
      <stop offset="100%" stop-color="#0e1a2b"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4cc9f0" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2a7fd6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0e1a2b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5d8f" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#4cc9f0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bgGrad)"/>

  <!-- Grid lines for physics/science feel -->
  <g opacity="0.15" stroke="#4cc9f0" stroke-width="1" stroke-dasharray="4 4">
    <line x1="40" y1="80" x2="600" y2="80"/>
    <line x1="40" y1="160" x2="600" y2="160"/>
    <line x1="40" y1="240" x2="600" y2="240"/>
    <line x1="40" y1="320" x2="600" y2="320"/>
  </g>

  <!-- Sloped Beach Line -->
  <polygon points="400,400 640,240 640,400" fill="#253549" opacity="0.6"/>
  <line x1="380" y1="400" x2="640" y2="230" stroke="#ffd166" stroke-width="3" opacity="0.8"/>

  <!-- Wave Shapes -->
  <path d="M 0,280 C 120,240 180,310 260,260 C 330,210 390,170 470,220 C 510,245 560,250 640,260 L 640,400 L 0,400 Z" fill="url(#wave1)"/>
  <path d="M 0,310 C 100,280 200,320 300,270 C 380,230 430,190 490,235 C 550,270 590,265 640,285 L 640,400 L 0,400 Z" fill="url(#wave2)"/>

  <!-- Wave Plunging Arc Effect -->
  <path d="M 440,210 C 470,165 505,175 495,215 C 485,245 450,235 440,210" fill="none" stroke="#fff" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Floating Badge / Formula -->
  <rect x="40" y="36" width="220" height="34" rx="8" fill="#0b1524" fill-opacity="0.85" stroke="#4cc9f0" stroke-width="1.5"/>
  <text x="52" y="59" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#4cc9f0">
    🌊 Parameter Iribarren (ξ)
  </text>

  <!-- Classification Tags -->
  <rect x="40" y="80" width="76" height="22" rx="6" fill="#ffd166" fill-opacity="0.2" stroke="#ffd166" stroke-width="1"/>
  <text x="49" y="95" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffd166">SPILLING</text>

  <rect x="122" y="80" width="80" height="22" rx="6" fill="#ff5d8f" fill-opacity="0.2" stroke="#ff5d8f" stroke-width="1"/>
  <text x="131" y="95" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#ff5d8f">PLUNGING</text>

  <rect x="208" y="80" width="94" height="22" rx="6" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
  <text x="216" y="95" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">COLLAPSING</text>

  <rect x="308" y="80" width="76" height="22" rx="6" fill="#34d399" fill-opacity="0.2" stroke="#34d399" stroke-width="1"/>
  <text x="318" y="95" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399">SURGING</text>

  <!-- Title & Subtitle -->
  <text x="40" y="170" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.6))">
    Simulasi Gelombang Pecah
  </text>
  <text x="40" y="200" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500" fill="#9db3c8">
    Simulasi fisika interaktif tipe pecah gelombang pantai secara real-time
  </text>

  <!-- Author Tag -->
  <rect x="40" y="235" width="230" height="28" rx="14" fill="#16263c" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="54" y="254" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#cfe0ee">
    👤 AIRA RANIAH YASMIN AZRI
  </text>
</svg>
