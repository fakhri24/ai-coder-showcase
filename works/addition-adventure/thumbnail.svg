<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg_addition-adventure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg_addition-adventure)"/>

  <!-- Extra artwork -->
  
            <!-- Math cards & star badges -->
            <rect x="180" y="190" width="130" height="120" rx="16" fill="#4f46e5" stroke="#a5b4fc" stroke-width="2.5"/>
            <text x="245" y="265" fill="#ffffff" font-family="sans-serif" font-size="36" font-weight="bold" text-anchor="middle">4 + 7</text>
            <rect x="330" y="190" width="130" height="120" rx="16" fill="#10b981" stroke="#6ee7b7" stroke-width="2.5" filter="url(#glow)"/>
            <text x="395" y="265" fill="#ffffff" font-family="sans-serif" font-size="42" font-weight="bold" text-anchor="middle">11 ✨</text>
        

  <!-- Badge Top -->
  <rect x="40" y="36" width="48" height="48" rx="12" fill="rgba(255,255,255,0.1)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="24" text-anchor="middle">➕</text>

  <!-- Title & Subtitle -->
  <text x="104" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Addition Adventure</text>
  <text x="104" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#818cf8">Math Flashcard Challenge Game</text>
</svg>