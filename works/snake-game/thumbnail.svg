<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg_snake-game" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg_snake-game)"/>

  <!-- Extra artwork -->
  
            <g stroke="#10b981" stroke-width="1" opacity="0.15" stroke-dasharray="6 6">
                <line x1="80" y1="100" x2="560" y2="100"/>
                <line x1="80" y1="180" x2="560" y2="180"/>
                <line x1="80" y1="260" x2="560" y2="260"/>
                <line x1="80" y1="340" x2="560" y2="340"/>
            </g>
            <rect x="180" y="260" width="36" height="36" rx="8" fill="#10b981"/>
            <rect x="224" y="260" width="36" height="36" rx="8" fill="#10b981"/>
            <rect x="268" y="260" width="36" height="36" rx="8" fill="#34d399"/>
            <rect x="312" y="260" width="36" height="36" rx="8" fill="#6ee7b7"/>
            <rect x="312" y="216" width="36" height="36" rx="8" fill="#a7f3d0"/>
            <circle cx="440" cy="234" r="16" fill="#ef4444" filter="url(#glow)"/>
            <polygon points="440,218 444,212 438,210" fill="#22c55e"/>
        

  <!-- Badge Top -->
  <rect x="40" y="36" width="48" height="48" rx="12" fill="rgba(255,255,255,0.1)" stroke="#10b981" stroke-width="1.5"/>
  <text x="64" y="70" font-size="24" text-anchor="middle">🐍</text>

  <!-- Title & Subtitle -->
  <text x="104" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Snake Game</text>
  <text x="104" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#10b981">Retro Arcade Classic</text>
</svg>