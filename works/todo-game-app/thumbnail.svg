<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg_todo-game-app" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg_todo-game-app)"/>

  <!-- Extra artwork -->
  
            <rect x="140" y="190" width="160" height="120" rx="16" fill="#581c87" fill-opacity="0.7" stroke="#c084fc" stroke-width="2"/>
            <circle cx="185" cy="230" r="8" fill="#34d399"/>
            <circle cx="215" cy="230" r="8" fill="#38bdf8"/>
            <circle cx="245" cy="230" r="8" fill="#f43f5e"/>
            <text x="220" y="285" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">⭐ Level 5</text>
            
            <rect x="330" y="190" width="170" height="120" rx="16" fill="#1e1b4b" fill-opacity="0.8" stroke="#818cf8" stroke-width="2"/>
            <line x1="355" y1="225" x2="475" y2="225" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
            <line x1="355" y1="255" x2="450" y2="255" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
            <line x1="355" y1="285" x2="430" y2="285" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
        

  <!-- Badge Top -->
  <rect x="40" y="36" width="48" height="48" rx="12" fill="rgba(255,255,255,0.1)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="64" y="70" font-size="24" text-anchor="middle">🎮</text>

  <!-- Title & Subtitle -->
  <text x="104" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Todo App + Games</text>
  <text x="104" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#c084fc">Productivity with Gamification</text>
</svg>