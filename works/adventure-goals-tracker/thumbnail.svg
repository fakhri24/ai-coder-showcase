<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg_adventure-goals-tracker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg_adventure-goals-tracker)"/>

  <!-- Extra artwork -->
  
            <!-- Mountain silhouette -->
            <polygon points="120,380 280,210 380,300 480,180 600,380" fill="#0369a1" opacity="0.5"/>
            <polygon points="280,210 310,240 290,245 270,230" fill="#ffffff" opacity="0.8"/>
            <polygon points="480,180 515,220 495,225 470,210" fill="#ffffff" opacity="0.8"/>
            <!-- Compass / Pin -->
            <circle cx="320" cy="150" r="24" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
            <polygon points="320,132 328,150 320,168 312,150" fill="#f59e0b"/>
        

  <!-- Badge Top -->
  <rect x="40" y="36" width="48" height="48" rx="12" fill="rgba(255,255,255,0.1)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="24" text-anchor="middle">🗺️</text>

  <!-- Title & Subtitle -->
  <text x="104" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Adventure Goals Tracker</text>
  <text x="104" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#38bdf8">Bucket List & Progress Journey</text>
</svg>