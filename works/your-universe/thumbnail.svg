<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg_your-universe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg_your-universe)"/>

  <!-- Extra artwork -->
  
            <!-- Orbit rings -->
            <ellipse cx="320" cy="240" rx="160" ry="70" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.4" transform="rotate(-15 320 240)"/>
            <ellipse cx="320" cy="240" rx="220" ry="95" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.3" transform="rotate(20 320 240)"/>
            <!-- Sun / Center planet -->
            <circle cx="320" cy="240" r="34" fill="#fbbf24" filter="url(#glow)"/>
            <!-- Planets -->
            <circle cx="220" cy="200" r="14" fill="#ec4899"/>
            <circle cx="420" cy="280" r="18" fill="#38bdf8"/>
            <circle cx="460" cy="190" r="10" fill="#34d399"/>
            <circle cx="170" cy="270" r="8" fill="#c084fc"/>
        

  <!-- Badge Top -->
  <rect x="40" y="36" width="48" height="48" rx="12" fill="rgba(255,255,255,0.1)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="24" text-anchor="middle">🌌</text>

  <!-- Title & Subtitle -->
  <text x="104" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Your Universe</text>
  <text x="104" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#818cf8">Build Your 14-Day Galaxy</text>
</svg>