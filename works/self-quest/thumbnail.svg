<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg_self-quest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16291D"/>
      <stop offset="50%" stop-color="#1F3D2B"/>
      <stop offset="100%" stop-color="#16291D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg_self-quest)"/>

  <!-- Extra artwork -->
  
            <!-- Tree / Compass of self values -->
            <circle cx="320" cy="240" r="80" fill="#1F3D2B" stroke="#D9A441" stroke-width="2" filter="url(#glow)"/>
            <circle cx="320" cy="240" r="65" fill="none" stroke="#F0C976" stroke-dasharray="4 4" stroke-width="1.5"/>
            <!-- Inner emblem -->
            <text x="320" y="230" font-size="36" text-anchor="middle">🧭</text>
            <text x="320" y="265" fill="#F5EBDC" font-family="Courier New, monospace" font-size="14" font-weight="bold" text-anchor="middle">VALUES</text>
        

  <!-- Badge Top -->
  <rect x="40" y="36" width="48" height="48" rx="12" fill="rgba(255,255,255,0.1)" stroke="#D9A441" stroke-width="1.5"/>
  <text x="64" y="70" font-size="24" text-anchor="middle">🌿</text>

  <!-- Title & Subtitle -->
  <text x="104" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">SELF QUEST</text>
  <text x="104" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#D9A441">Discover Your Values & Choices</text>
</svg>