<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg_pomodoro-timer-app" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg_pomodoro-timer-app)"/>

  <!-- Extra artwork -->
  
            <!-- Circular timer gauge -->
            <circle cx="320" cy="240" r="85" fill="#7f1d1d" fill-opacity="0.3" stroke="#b91c1c" stroke-width="8"/>
            <circle cx="320" cy="240" r="85" fill="none" stroke="#f87171" stroke-width="8" stroke-dasharray="400 534" stroke-linecap="round" transform="rotate(-90 320 240)" filter="url(#glow)"/>
            <text x="320" y="252" fill="#fff" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="middle">25:00</text>
        

  <!-- Badge Top -->
  <rect x="40" y="36" width="48" height="48" rx="12" fill="rgba(255,255,255,0.1)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="64" y="70" font-size="24" text-anchor="middle">⏱️</text>

  <!-- Title & Subtitle -->
  <text x="104" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Pomodoro Timer</text>
  <text x="104" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#ef4444">Structured Productivity & Focus</text>
</svg>