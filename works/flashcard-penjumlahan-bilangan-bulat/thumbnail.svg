<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg_flashcard-penjumlahan-bilangan-bulat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg_flashcard-penjumlahan-bilangan-bulat)"/>

  <!-- Extra artwork -->
  
            <!-- Mountain climb trail -->
            <polygon points="140,380 320,180 500,380" fill="#0d9488" opacity="0.6"/>
            <polygon points="320,180 350,220 330,225 310,210" fill="#ffffff" opacity="0.9"/>
            <!-- Math card -->
            <rect x="230" y="240" width="180" height="80" rx="14" fill="#ffffff" fill-opacity="0.95" filter="url(#glow)"/>
            <text x="320" y="290" fill="#0f766e" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle">(-5) + 12 = ?</text>
        

  <!-- Badge Top -->
  <rect x="40" y="36" width="48" height="48" rx="12" fill="rgba(255,255,255,0.1)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="64" y="70" font-size="24" text-anchor="middle">🏔️</text>

  <!-- Title & Subtitle -->
  <text x="104" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Naik Gunung</text>
  <text x="104" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#f59e0b">Flashcard Penjumlahan Bilangan Bulat</text>
</svg>