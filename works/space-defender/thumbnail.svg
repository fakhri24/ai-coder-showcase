<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg_space-defender" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg_space-defender)"/>

  <!-- Extra artwork -->
  
            <!-- Star invaders -->
            <polygon points="240,190 255,210 225,210" fill="#f43f5e" filter="url(#glow)"/>
            <polygon points="320,175 335,195 305,195" fill="#eab308" filter="url(#glow)"/>
            <polygon points="400,190 415,210 385,210" fill="#a855f7" filter="url(#glow)"/>
            <!-- Lasers -->
            <line x1="316" y1="280" x2="316" y2="220" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
            <line x1="324" y1="280" x2="324" y2="220" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
            <!-- Player Ship -->
            <polygon points="320,280 340,320 320,310 300,320" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
        

  <!-- Badge Top -->
  <rect x="40" y="36" width="48" height="48" rx="12" fill="rgba(255,255,255,0.1)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="24" text-anchor="middle">🚀</text>

  <!-- Title & Subtitle -->
  <text x="104" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Space Defender</text>
  <text x="104" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#38bdf8">Classic Space Arcade Shooter</text>
</svg>