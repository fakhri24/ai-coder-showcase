<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg_biology-cell-game" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg_biology-cell-game)"/>

  <!-- Extra artwork -->
  
            <!-- Cell membrane -->
            <circle cx="320" cy="240" r="85" fill="#0f766e" fill-opacity="0.4" stroke="#2dd4bf" stroke-width="3" filter="url(#glow)"/>
            <!-- Nucleus -->
            <circle cx="320" cy="240" r="35" fill="#115e59" stroke="#5eead4" stroke-width="2.5"/>
            <circle cx="320" cy="240" r="15" fill="#99f6e4"/>
            <!-- Mitochondria / Organelles -->
            <ellipse cx="265" cy="210" rx="16" ry="8" fill="#f43f5e" opacity="0.8" transform="rotate(-20 265 210)"/>
            <ellipse cx="375" cy="265" rx="18" ry="9" fill="#eab308" opacity="0.8" transform="rotate(35 375 265)"/>
            <circle cx="365" cy="195" r="6" fill="#38bdf8"/>
            <circle cx="270" cy="275" r="8" fill="#a855f7"/>
        

  <!-- Badge Top -->
  <rect x="40" y="36" width="48" height="48" rx="12" fill="rgba(255,255,255,0.1)" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="64" y="70" font-size="24" text-anchor="middle">🔬</text>

  <!-- Title & Subtitle -->
  <text x="104" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">BioCell</text>
  <text x="104" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#14b8a6">Belajar Sel Hewan & Tumbuhan</text>
</svg>